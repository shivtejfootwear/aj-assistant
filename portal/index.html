<title>AJ Devices Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: single-column control console, dark HUD identity matching the AJ app */
  :root{
    --bg:#04060C; --panel:#0b1424; --panel2:#0e1a30; --stroke:#1e3350;
    --fg:#eaf4ff; --dim:#7f93b5; --cyan:#29d3ff; --violet:#8b6cff; --mint:#3df5c4; --bad:#ff5c7a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(60rem 30rem at 50% -10%, #13263f 0%, rgba(4,6,12,0) 60%),
      var(--bg);
    color:var(--fg); font-family:var(--sans); line-height:1.5;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:18px; margin:0 auto; max-width:620px;}
  h1{font-size:1.4rem; margin:0; letter-spacing:.02em}
  .tag{font-family:var(--mono); font-size:.72rem; color:var(--cyan); letter-spacing:.18em; text-transform:uppercase}
  header{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .logo{width:46px;height:46px;flex:0 0 auto}
  .chip{margin-left:auto; font-family:var(--mono); font-size:.72rem; padding:5px 11px; border-radius:999px;
    border:1px solid var(--stroke); background:#0d2030; color:var(--mint); display:flex; gap:7px; align-items:center}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
  .card{background:linear-gradient(315deg,var(--panel2),var(--panel)); border:1px solid var(--stroke);
    border-radius:18px; padding:16px; margin-bottom:14px}
  .card h2{font-size:1rem; margin:0 0 6px; color:var(--cyan)}
  label{display:block; font-size:.8rem; color:var(--dim); margin:10px 0 4px}
  input{width:100%; background:#0a1324; border:1px solid var(--stroke); color:var(--fg);
    border-radius:12px; padding:11px 13px; font-size:.95rem; font-family:var(--sans)}
  input:focus{outline:2px solid var(--cyan); outline-offset:1px}
  button{font-family:var(--sans); font-size:.9rem; cursor:pointer; border-radius:12px;
    border:1px solid var(--stroke); background:#13263f; color:var(--cyan); padding:11px 14px; min-height:44px}
  button:hover{border-color:var(--cyan)}
  button.primary{background:linear-gradient(315deg,var(--cyan),var(--violet)); color:#04060c; border:0; font-weight:600}
  button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row>button{flex:1 1 30%; min-width:92px}
  .msg{font-size:.82rem; color:var(--dim); margin-top:10px; min-height:1.2em}
  .msg.err{color:var(--bad)}
  .dev-name{font-size:1.05rem; font-weight:600; color:var(--cyan); display:flex; align-items:center; gap:8px}
  .dev-stat{font-family:var(--mono); font-size:.9rem; color:var(--fg); margin-top:8px; font-variant-numeric:tabular-nums}
  .dev-sub{font-size:.8rem; color:var(--dim); margin-top:4px}
  a.loc{color:var(--mint); font-size:.85rem; display:inline-block; margin-top:8px; text-decoration:none}
  .muted{color:var(--dim); font-size:.86rem}
  .hint{font-size:.78rem; color:var(--dim); margin-top:10px; line-height:1.45}
  footer{font-size:.74rem; color:var(--dim); text-align:center; margin:18px 0 6px; line-height:1.5}
</style>

<header>
  <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
    <circle cx="54" cy="54" r="30" fill="#29d3ff" opacity=".10"/>
    <path d="M54,24 L54,32" stroke="#29d3ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="54" cy="22" r="3.2" fill="#8b6cff"/>
    <rect x="26" y="46" width="5" height="16" rx="2" fill="#29d3ff"/>
    <rect x="77" y="46" width="5" height="16" rx="2" fill="#29d3ff"/>
    <rect x="31" y="32" width="46" height="44" rx="13" fill="#0e1a30" stroke="#29d3ff" stroke-width="3"/>
    <rect x="36.5" y="43" width="35" height="17" rx="8.5" fill="#03060e" stroke="#1b7fa0" stroke-width="1.5"/>
    <rect x="42" y="48" width="8" height="7" rx="3.5" fill="#29d3ff"/>
    <rect x="58" y="48" width="8" height="7" rx="3.5" fill="#29d3ff"/>
  </svg>
  <div>
    <h1>AJ</h1>
    <div class="tag">My Devices Portal</div>
  </div>
  <div class="chip"><span class="dot" id="dot"></span><span id="chip">OFFLINE</span></div>
</header>

<!-- Setup + login -->
<section class="card" id="authCard">
  <h2>Login</h2>
  <div id="setupBox">
    <label for="url">Supabase Project URL</label>
    <input id="url" placeholder="https://xxxx.supabase.co" autocomplete="off">
    <label for="key">Supabase anon public key</label>
    <input id="key" placeholder="eyJhbGc..." autocomplete="off">
  </div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username">
  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <div class="row">
    <button class="primary" id="loginBtn">Login</button>
  </div>
  <div class="msg" id="authMsg"></div>
  <div class="hint">यह वही account है जो आपके फ़ोनों के AJ app में डाला है। URL और key एक बार डालने पर इसी browser में याद रहेंगे।</div>
</section>

<!-- Devices -->
<section id="deviceCard" hidden>
  <div class="card">
    <h2 style="display:flex;align-items:center;gap:10px">मेरे फ़ोन
      <button id="refreshBtn" style="margin-left:auto;padding:7px 12px;min-height:0">↻ ताज़ा</button>
      <button id="logoutBtn" style="padding:7px 12px;min-height:0">Logout</button>
    </h2>
    <div class="muted" id="devMsg">लोड हो रहा है...</div>
  </div>
  <div id="list"></div>
</section>

<footer>
  हर फ़ोटो/रिकॉर्डिंग सामने वाले फ़ोन पर दिखती है (notification, आवाज़, हरा निशान)।<br>
  सिर्फ अपने फ़ोनों के लिए।
</footer>

<script>
"use strict";
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = id => document.getElementById(id);
let S = {
  url: LS.get("aj_url") || "",
  key: LS.get("aj_key") || "",
  access: LS.get("aj_access") || "",
  refresh: LS.get("aj_refresh") || "",
  exp: Number(LS.get("aj_exp") || 0),
  uid: LS.get("aj_uid") || "",
  email: LS.get("aj_email") || ""
};
let timer = null;

$("url").value = S.url;
$("key").value = S.key;
$("email").value = S.email;
if (S.url && S.key) $("setupBox").hidden = true;

function setChip(label, col){
  $("chip").textContent = label;
  $("chip").style.color = col;
  $("dot").style.background = col;
}

function saveSession(j){
  S.access = j.access_token || S.access;
  S.refresh = j.refresh_token || S.refresh;
  S.exp = Date.now() + (j.expires_in || 3600) * 1000;
  if (j.user){ S.uid = j.user.id; S.email = j.user.email || ""; }
  LS.set("aj_access", S.access); LS.set("aj_refresh", S.refresh);
  LS.set("aj_exp", String(S.exp)); LS.set("aj_uid", S.uid); LS.set("aj_email", S.email);
}

async function ensureToken(){
  if (S.access && Date.now() < S.exp - 60000) return true;
  if (!S.refresh) return false;
  const r = await fetch(S.url + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST",
    headers:{ "apikey":S.key, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: S.refresh })
  });
  if (!r.ok){ S.refresh=""; LS.del("aj_refresh"); return false; }
  saveSession(await r.json());
  return true;
}

async function api(path, opts){
  if (!(await ensureToken())) throw new Error("login");
  const o = opts || {};
  o.headers = Object.assign({ "apikey":S.key, "Authorization":"Bearer "+S.access }, o.headers||{});
  return fetch(S.url + path, o);
}

async function login(){
  const msg = $("authMsg"); msg.className="msg"; msg.textContent="Login हो रहा है...";
  S.url = $("url").value.trim().replace(/\/+$/,"");
  S.key = $("key").value.trim();
  if (!S.url.startsWith("https://")){ msg.className="msg err"; msg.textContent="सही Project URL डालिए (https:// से)"; return; }
  LS.set("aj_url", S.url); LS.set("aj_key", S.key);
  try{
    const r = await fetch(S.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{ "apikey":S.key, "Content-Type":"application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), password: $("pass").value })
    });
    if (!r.ok){
      let e; try{ e=(await r.json()); }catch(_){ e={}; }
      msg.className="msg err";
      msg.textContent = "Login नहीं हुआ: " + (e.error_description || e.msg || e.message || ("code "+r.status));
      return;
    }
    saveSession(await r.json());
    showDevices();
  }catch(err){
    msg.className="msg err"; msg.textContent="Internet नहीं मिला";
  }
}

function logout(){
  S.access=""; S.refresh=""; S.uid="";
  LS.del("aj_access"); LS.del("aj_refresh"); LS.del("aj_exp"); LS.del("aj_uid");
  if (timer) clearInterval(timer);
  $("deviceCard").hidden = true;
  $("authCard").hidden = false;
  setChip("OFFLINE","#3df5c4");
}

function showDevices(){
  $("authCard").hidden = true;
  $("deviceCard").hidden = false;
  setChip("LINKED","#3df5c4");
  loadDevices();
  if (timer) clearInterval(timer);
  timer = setInterval(loadDevices, 15000);
}

function esc(s){ return String(s==null?"":s).replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

async function loadDevices(){
  try{
    const r = await api("/rest/v1/aj_devices?select=device_id,name,status,last_seen&order=last_seen.desc");
    if (!r.ok){ $("devMsg").textContent = "पढ़ नहीं पाया (code "+r.status+")"; return; }
    render(await r.json());
  }catch(e){
    if (e.message === "login"){ logout(); return; }
    $("devMsg").textContent = "Internet नहीं मिला";
  }
}

function render(devs){
  $("devMsg").textContent = devs.length ? (devs.length + " फ़ोन") : "कोई फ़ोन नहीं मिला। हर फ़ोन पर AJ खोलकर इसी account से login कीजिए।";
  const list = $("list");
  list.innerHTML = "";
  devs.forEach(d => {
    const s = d.status || {};
    const mins = d.last_seen ? Math.floor((Date.now() - Date.parse(d.last_seen))/60000) : -1;
    const online = mins>=0 && mins<=3;
    const seen = mins<0 ? "" : mins===0 ? " • अभी online" : mins<60 ? ` • ${mins} मिनट पहले` : ` • ${Math.floor(mins/60)} घंटे पहले`;
    const stat = [];
    if ("battery" in s) stat.push("🔋 "+s.battery+"%"+(s.charging?" ⚡":""));
    if ("free_gb" in s) stat.push("💾 "+s.free_gb+"/"+s.total_gb+" GB");
    if ("sms" in s) stat.push("✉ "+s.sms);
    if ("missed" in s) stat.push("📞 "+s.missed+" missed");
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      `<div class="dev-name">${online?"🟢":"⚪"} ${esc(d.name||"फ़ोन")}<span class="dev-sub">${seen}</span></div>` +
      (stat.length ? `<div class="dev-stat">${stat.join("   ")}</div>` : "") +
      (("lat" in s) ? `<a class="loc" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}">📍 location देखें${s.loc_age_min?` (${s.loc_age_min} मिनट पुरानी)`:""}</a>` : "");
    const r1 = document.createElement("div"); r1.className="row";
    r1.append(mkBtn("🔔 बजाओ",()=>cmd(d,"ring")), mkBtn("📍 location",()=>cmd(d,"locate")), mkBtn("↻ status",()=>cmd(d,"status")));
    const r2 = document.createElement("div"); r2.className="row";
    r2.append(mkBtn("📷 पीछे",()=>cmd(d,"photo_back")), mkBtn("🤳 आगे",()=>cmd(d,"photo_front")), mkBtn("🎙 15s",()=>cmd(d,"record",{sec:15})));
    const r3 = document.createElement("div"); r3.className="row";
    r3.append(mkBtn("📥 नया फ़ोटो/रिकॉर्डिंग खोलो",()=>openMedia(d)));
    el.append(r1,r2,r3);
    const note = document.createElement("div"); note.className="hint";
    note.textContent = "फ़ोटो/रिकॉर्डिंग माँगने पर उस फ़ोन पर notification, आवाज़ और हरा निशान दिखता है। कुछ सेकंड बाद ‘खोलो’ दबाएँ।";
    el.append(note);
    list.append(el);
  });
}

function mkBtn(label, fn){
  const b = document.createElement("button");
  b.textContent = label; b.addEventListener("click", fn);
  return b;
}

async function cmd(d, type, args){
  try{
    const body = { target: d.device_id, type };
    if (args) body.args = args;
    const r = await api("/rest/v1/aj_commands", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
    setChip(r.ok ? "SENT" : "ERROR", r.ok ? "#8b6cff" : "#ff5c7a");
    setTimeout(()=>setChip("LINKED","#3df5c4"), 2500);
  }catch(e){ if (e.message==="login") logout(); }
}

async function openMedia(d){
  try{
    const r = await api("/rest/v1/aj_commands?select=result&target=eq."+d.device_id+"&state=eq.done&type=in.(photo_back,photo_front,record)&order=id.desc&limit=1");
    const rows = await r.json();
    const path = rows[0] && rows[0].result && rows[0].result.path;
    if (!path){ alertInline(d,"अभी कोई media नहीं मिला। थोड़ा और रुककर फिर दबाएँ।"); return; }
    const sr = await api("/storage/v1/object/sign/aj-media/"+path, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ expiresIn: 21600 })
    });
    const sj = await sr.json();
    if (!sj.signedURL){ alertInline(d,"link नहीं बना"); return; }
    const a = document.createElement("a");
    a.href = S.url + "/storage/v1" + sj.signedURL;
    a.target = "_blank"; a.rel = "noopener";
    document.body.append(a); a.click(); a.remove();
  }catch(e){ if (e.message==="login") logout(); }
}

function alertInline(d, text){
  $("devMsg").textContent = text;
  setTimeout(loadDevices, 100);
}

$("loginBtn").addEventListener("click", login);
$("pass").addEventListener("keydown", e => { if (e.key==="Enter") login(); });
$("refreshBtn").addEventListener("click", loadDevices);
$("logoutBtn").addEventListener("click", logout);

if (S.refresh && S.uid) showDevices(); else setChip("OFFLINE","#3df5c4");
</script>
