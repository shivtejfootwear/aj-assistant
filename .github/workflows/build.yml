name: Build AJ APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code लो
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: APK बनाओ
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK का नाम
        run: cp app/build/outputs/apk/release/app-release.apk "AJ-${{ github.run_number }}.apk"

      - name: APK सेव करो (Actions में)
        uses: actions/upload-artifact@v4
        with:
          name: AJ-apk-${{ github.run_number }}
          path: AJ-*.apk

      - name: Release में डालो (फ़ोन से आसान download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AJ build ${{ github.run_number }}
          body: AJ का नया APK। फ़ोन पर download करके install करें, पुराना हटाने की ज़रूरत नहीं।
          files: AJ-*.apk
